<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dery Andrian Pratama — IT Project Manager & Technical Product Designer based in Yogyakarta, Indonesia. Explore experience, selected projects, achievements, and portfolio."
    />
    <meta name="author" content="Dery Andrian Pratama" />
    <meta name="theme-color" content="#080A0D" />
    <title>Dery Andrian Pratama — IT Project Manager & Technical Product Designer</title>
    <!-- Open Graph (og:image is a placeholder until a real portrait/cover is supplied) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dery Andrian Pratama — IT Project Manager & Technical Product Designer" />
    <meta
      property="og:description"
      content="IT Project Manager & Technical Product Designer based in Yogyakarta, Indonesia. Experience, selected projects, achievements, and portfolio."
    />
    <meta property="og:image" content="/images/hero/portrait-placeholder.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dery Andrian Pratama — IT Project Manager & Technical Product Designer" />
    <meta
      name="twitter:description"
      content="IT Project Manager & Technical Product Designer based in Yogyakarta, Indonesia."
    />
    <script>
      // No flash of wrong theme: set data-theme synchronously before paint.
      (function () {
        try {
          var stored = localStorage.getItem('dery-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          var lang = localStorage.getItem('dery-lang');
          if (lang === 'id' || lang === 'en') document.documentElement.setAttribute('lang', lang);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the font stylesheet so display/type render without FOIT (fonts use display=swap) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Tektur:wght@700;800;900&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Tektur:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms detection: static mirror of the React contact form.
         Field names must stay in sync with <ContactForm>. Submissions are only
         captured when the site is deployed on Netlify. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
